services:
  - type: web
    name: upi-chatbot-backend
    runtime: python
    rootDir: reports
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn chatbot_backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
