<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UPI Risk Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* UPI Risk Analytics — Bloomberg-terminal density. Dark default, light variant. */

:root, [data-theme="dark"]{
  --bg: #0b0d10;
  --bg-1: #11141a;
  --bg-2: #161a21;
  --bg-3: #1d222b;
  --bg-hover: #1f2530;
  --fg: #e7eaf0;
  --fg-1: #b6bdc9;
  --fg-2: #7c8492;
  --fg-3: #4a525e;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --grid: rgba(255,255,255,0.04);
  --accent: #4cc4d7;
  --accent-soft: rgba(76,196,215,0.14);
  --ok: #6ec96a;
  --ok-soft: rgba(110,201,106,0.16);
  --warn: #f0b049;
  --warn-soft: rgba(240,176,73,0.16);
  --bad: #ec5b5b;
  --bad-soft: rgba(236,91,91,0.16);
  --p2p: #8a7df0;
  --merchant: #6ec96a;
  --utility: #f0b049;
  --retail: #4cc4d7;
}

[data-theme="light"]{
  --bg: #f6f6f3;
  --bg-1: #ffffff;
  --bg-2: #f0f0eb;
  --bg-3: #e6e6df;
  --bg-hover: #ececea;
  --fg: #181a1c;
  --fg-1: #34383d;
  --fg-2: #6a6f78;
  --fg-3: #a8adb5;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.16);
  --grid: rgba(0,0,0,0.05);
  --accent: #0d8b9e;
  --accent-soft: rgba(13,139,158,0.14);
  --ok: #2f8c2a;
  --ok-soft: rgba(47,140,42,0.14);
  --warn: #b87515;
  --warn-soft: rgba(184,117,21,0.14);
  --bad: #c93a3a;
  --bad-soft: rgba(201,58,58,0.14);
  --p2p: #5d4dcf;
  --merchant: #2f8c2a;
  --utility: #b87515;
  --retail: #0d8b9e;
}

*{box-sizing:border-box;margin:0;padding:0;}
html, body{height:100%;}
body{
  font-family: 'Geist', system-ui, -apple-system, sans-serif;
  font-size: 12px;
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "tnum" 1; letter-spacing:-0.01em; }
.num{ font-variant-numeric: tabular-nums; }
.dim{ color: var(--fg-2); }
.accent{ color: var(--accent); }
.bad-fg{ color: var(--bad); }
.warn-fg{ color: var(--warn); }
.ok-fg{ color: var(--ok); }
.bad-bg{ background: var(--bad); }
.accent-bg{ background: var(--accent); }
.cat-p2p-bg{ background: var(--p2p); }
.cat-merchant-bg{ background: var(--merchant); }
.cat-utility-bg{ background: var(--utility); }
.cat-retail-bg{ background: var(--retail); }

button{ font-family: inherit; font-size: inherit; cursor:pointer; border:0; background:transparent; color:inherit; }

/* ─── App shell ─── */
.app{
  display: grid;
  grid-template-columns: 200px 1fr;
  grid-template-rows: 44px 1fr;
  height: 100vh;
  width: 100vw;
}
.app.compact{ grid-template-columns: 56px 1fr; }
.app.dense{ font-size: 11px; }

.topbar{
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  border-bottom: 0.5px solid var(--border);
  background: var(--bg-1);
}
.brand{
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; letter-spacing: 0.04em; font-size: 13px;
}
.brand .logo{
  width: 16px; height: 16px;
  background: var(--accent);
  clip-path: polygon(0 0, 60% 0, 100% 50%, 60% 100%, 0 100%, 40% 50%);
}
.brand small{ font-weight: 500; color: var(--fg-2); letter-spacing: 0.06em; font-size: 10px; margin-left: 4px;}

.topbar-search{
  flex: 1; max-width: 360px;
  height: 26px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px;
  border: 0.5px solid var(--border-strong);
  border-radius: 4px;
  background: var(--bg);
  color: var(--fg-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.topbar-search input{
  flex: 1; background: transparent; border: 0; outline: 0; color: var(--fg);
  font-family: inherit; font-size: inherit;
}
.topbar-search kbd{
  font-size: 9px; padding: 1px 4px; border-radius: 3px;
  background: var(--bg-2); color: var(--fg-2);
  border: 0.5px solid var(--border);
}

.topbar-spacer{ flex:1; }
.topbar-meta{
  display: flex; align-items: center; gap: 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--fg-2);
}
.topbar-meta .live{
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--ok);
}
.topbar-meta .live::before{
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 6px var(--ok);
  animation: pulse 1.6s infinite;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ─── Sidebar ─── */
.sidebar{
  background: var(--bg-1);
  border-right: 0.5px solid var(--border);
  padding: 8px 0;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 2px;
}
.nav-grp{     
  font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
  color: var(--fg-3); text-transform: uppercase;
  padding: 12px 14px 4px;
}
.nav-item{
  display: flex; align-items: center; gap: 10px;
  padding: 6px 14px;
  color: var(--fg-1);
  font-size: 12px;
  cursor: pointer;
  border-left: 2px solid transparent;
  position: relative;
}
.nav-item:hover{ background: var(--bg-2); }
.nav-item.active{
  background: var(--bg-2);
  color: var(--fg);
  border-left-color: var(--accent);
}
.nav-icon{
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-2);
}
.nav-item.active .nav-icon{ color: var(--accent); }
.nav-badge{
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg-3); color: var(--fg-2);
}
.nav-badge.bad{ background: var(--bad-soft); color: var(--bad); }
.nav-badge.warn{ background: var(--warn-soft); color: var(--warn); }
.app.compact .nav-item span:not(.nav-badge), .app.compact .nav-grp{ display:none; }
.app.compact .nav-item{ justify-content: center; padding: 8px; }

.sidebar-foot{
  margin-top: auto;
  padding: 12px 14px;
  border-top: 0.5px solid var(--border);
  font-size: 10px; color: var(--fg-2);
  font-family: 'JetBrains Mono', monospace;
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar-foot .stat{
  display: flex; justify-content: space-between;
}

/* ─── Main ─── */
.main{
  overflow: auto;
  padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}

/* ─── Page header ─── */
.page-hd{
  display: flex; align-items: center; gap: 14px;
  padding-bottom: 4px;
}
.page-hd h1{
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
}
.page-hd .crumbs{
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--fg-2);
}
.page-hd .actions{ margin-left:auto; display:flex; gap: 6px; }
.btn-sm{
  height: 24px; padding: 0 10px;
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
  border: 0.5px solid var(--border-strong);
  border-radius: 4px;
  background: var(--bg-1); color: var(--fg-1);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-sm:hover{ background: var(--bg-2); color: var(--fg); }
.btn-sm.primary{ background: var(--accent); color: #001318; border-color: var(--accent); }

/* ─── Card ─── */
.card{
  background: var(--bg-1);
  border: 0.5px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  display: flex; flex-direction: column;
  min-width: 0;
}
.card-hd{
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
  gap: 8px;
}
.card-title{
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--fg-2); text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 8px;
}
.pulse-dot{
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--bad); display: inline-block;
  box-shadow: 0 0 6px var(--bad);
  animation: pulse 1.4s infinite;
}

/* ─── Layouts ─── */
.row{ display: grid; gap: 10px; }
.r2{ grid-template-columns: repeat(2, 1fr); }
.r3{ grid-template-columns: repeat(3, 1fr); }
.r4{ grid-template-columns: repeat(4, 1fr); }
.r6{ grid-template-columns: repeat(6, 1fr); }
.r8{ grid-template-columns: repeat(8, 1fr); }
.r-21{ grid-template-columns: 2fr 1fr; }
.r-12{ grid-template-columns: 1fr 2fr; }
.r-32{ grid-template-columns: 3fr 2fr; }

/* ─── KPI ─── */
.kpi{
  background: var(--bg-1);
  border: 0.5px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: 4px;
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 4px;
  min-width: 0;
}
.kpi-hd{
  display: flex; justify-content: space-between; align-items: center;
}
.kpi .lbl{
  font-size: 9px; letter-spacing: 0.1em; color: var(--fg-2); font-weight: 600;
}
.kpi-delta{ font-family: 'JetBrains Mono', monospace; font-size: 10px; }
.kpi-delta.good{ color: var(--ok); }
.kpi-delta.bad{ color: var(--bad); }
.kpi-delta.neutral{ color: var(--fg-2); }
.kpi-val{
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  font-size: 20px; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-foot{
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-top: auto;
}
.kpi-sub{ font-size: 10px; color: var(--fg-2); font-family: 'JetBrains Mono', monospace; }

/* ─── Pills ─── */
.risk-pill{
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 18px;
  padding: 0 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 600;
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
}
.risk-pill.good{ background: var(--ok-soft); color: var(--ok); }
.risk-pill.warn{ background: var(--warn-soft); color: var(--warn); }
.risk-pill.bad{ background: var(--bad-soft); color: var(--bad); }
.cat-pill{
  display: inline-block;
  padding: 1px 6px;
  font-size: 10px; font-weight: 500;
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
}
.cat-p2p{ background: rgba(138,125,240,0.18); color: var(--p2p); }
.cat-merchant{ background: rgba(110,201,106,0.18); color: var(--merchant); }
.cat-utility{ background: rgba(240,176,73,0.18); color: var(--utility); }
.cat-retail{ background: rgba(76,196,215,0.18); color: var(--retail); }
.flag-pill{
  display: inline-block; padding: 0 5px; height: 16px; line-height: 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600;
  border-radius: 2px;
}
.flag-pill.bad{ background: var(--bad); color: #fff; }
.flag-pill.warn{ background: var(--warn-soft); color: var(--warn); border: 0.5px solid var(--warn); }
.badge{
  display: inline-flex; align-items: center;
  padding: 1px 6px; height: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600; letter-spacing: 0.04em;
  border-radius: 2px;
}
.badge.bad{ background: var(--bad-soft); color: var(--bad); }
.badge.warn{ background: var(--warn-soft); color: var(--warn); }
.badge.ok{ background: var(--ok-soft); color: var(--ok); }
.badge.accent{ background: var(--accent-soft); color: var(--accent); }

/* ─── Live feed ─── */
.live-card{ padding: 0; overflow: hidden; }
.live-card .card-hd{ padding: 10px 12px; margin: 0; border-bottom: 0.5px solid var(--border); }
.feed-table{
  display: flex; flex-direction: column;
}
.feed-row{
  display: grid;
  grid-template-columns: 110px 100px 90px 72px 80px 100px 90px 56px 72px;
  gap: 8px;
  padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  align-items: center;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
}
.feed-row > span{ overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row:hover{ background: var(--bg-2); }
.feed-row.alert{ background: rgba(236,91,91,0.04); }
.feed-row.alert:hover{ background: rgba(236,91,91,0.10); }
.feed-hd{
  font-size: 9px; color: var(--fg-2); font-weight: 600;
  letter-spacing: 0.08em; padding: 6px 12px;
  border-bottom: 0.5px solid var(--border-strong);
  background: var(--bg-2);
  cursor: default;
}
.feed-hd:hover{ background: var(--bg-2); }
.feed-body{ overflow-y: auto; }
.feed-body::-webkit-scrollbar{ width: 6px; }
.feed-body::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 3px;}
.feed-foot{
  display: flex; justify-content: space-between;
  padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--fg-2);
  border-top: 0.5px solid var(--border);
  background: var(--bg-2);
}
@keyframes flashIn{ from{ background: var(--accent-soft); } to{ background: transparent; } }
.feed-row.new{ animation: flashIn 1s ease; }

/* ─── Segmented ─── */
.seg{
  display: inline-flex;
  border: 0.5px solid var(--border-strong);
  border-radius: 4px;
  overflow: hidden;
  height: 22px;
}
.seg-btn{
  height: 100%;
  padding: 0 10px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--fg-2);
  border-right: 0.5px solid var(--border);
}
.seg-btn:last-child{ border-right: 0; }
.seg-btn:hover{ color: var(--fg); background: var(--bg-2); }
.seg-btn.active{ background: var(--accent-soft); color: var(--accent); }

/* ─── Histogram ─── */
.hist{
  display: flex; align-items: flex-end; justify-content: space-between;
  height: 130px;
  gap: 4px;
  padding-bottom: 4px;
}
.hist-col{
  flex: 1;
  display: flex; flex-direction: column; align-items: center;
  height: 100%;
  gap: 4px;
}
.hist-cnt{ font-size: 9px; color: var(--fg-2); }
.hist-bar-wrap{
  flex: 1; width: 100%;
  display: flex; align-items: flex-end;
}
.hist-bar{
  width: 100%; min-height: 2px;
  border-radius: 2px 2px 0 0;
}
.hist-bar.green{ background: var(--ok); }
.hist-bar.amber{ background: var(--warn); }
.hist-bar.red{ background: var(--bad); }
.hist-lbl{ font-size: 9px; color: var(--fg-3); }
.hist-foot{
  display: flex; gap: 14px; padding-top: 6px;
  border-top: 0.5px solid var(--border);
  font-size: 10px; color: var(--fg-2);
  font-family: 'JetBrains Mono', monospace;
}
.sw{ display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 5px; vertical-align: middle; }
.sw.green{ background: var(--ok); }
.sw.amber{ background: var(--warn); }
.sw.red{ background: var(--bad); }

/* ─── Velocity ─── */
.vel-num{
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 26px; color: var(--bad);
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.vel-unit{ font-size: 11px; color: var(--fg-2); font-weight: 400; margin-left: 2px; }
.vel-bars{
  display: flex; align-items: flex-end; gap: 3px; height: 50px; margin: 6px 0;
}
.vel-b{
  flex: 1; min-height: 3px;
  background: var(--accent-soft); border-radius: 1px;
}
.vel-b.hot{ background: var(--bad); }
.vel-foot{ font-size: 10px; }

/* ─── Bank table ─── */
.bank-tbl, .model-tbl, .mule-tbl{
  display: flex; flex-direction: column;
}
.bank-row{
  display: grid;
  grid-template-columns: 50px 1fr 60px 50px 70px 60px;
  gap: 6px; align-items: center;
  padding: 4px 0;
  border-bottom: 0.5px solid var(--border);
  font-size: 11px;
}
.bank-row:last-child{ border-bottom: 0; }
.bank-hd{
  font-size: 9px; color: var(--fg-2); font-weight: 600;
  letter-spacing: 0.08em; padding-bottom: 4px;
  border-bottom: 0.5px solid var(--border-strong);
}
.bank-bar{
  display: block; height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden;
}
.bank-bar > span{ display: block; height: 100%; background: var(--bad); }

/* ─── Category mix ─── */
.catmix{ display: flex; flex-direction: column; gap: 8px; }
.catmix-row{ display: flex; flex-direction: column; gap: 4px; }
.catmix-hd{ display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
.catmix-bars{ display: flex; flex-direction: column; gap: 3px; }
.catmix-bar{
  position: relative;
  height: 16px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.catmix-bar .fill{
  display: block; height: 100%;
}
.catmix-bar label{
  position: absolute; left: 6px; top: 0; height: 16px; line-height: 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--fg);
  mix-blend-mode: difference;
}

/* ─── Geo ─── */
.geo-list{ display: flex; flex-direction: column; gap: 4px; }
.geo-row{
  display: grid;
  grid-template-columns: 80px 1fr 36px 50px;
  gap: 6px; align-items: center;
  padding: 3px 0;
  font-size: 11px;
}
.geo-city{ font-size: 11px; }
.geo-bar{
  display: block; height: 6px; background: var(--bg-3); border-radius: 2px; overflow: hidden;
}
.geo-bar > span{ display: block; height: 100%; }

/* ─── Patterns ─── */
.pat-list{ display: flex; flex-direction: column; gap: 6px; }
.pat-row{
  display: flex; flex-direction: column; gap: 3px;
  padding: 5px 0;
  border-bottom: 0.5px solid var(--border);
}
.pat-row:last-child{ border-bottom: 0; }
.pat-hd{
  display: grid;
  grid-template-columns: 8px 1fr 32px 28px;
  gap: 8px; align-items: center;
  font-size: 11px;
}
.pat-name{ font-weight: 500; }
.sev{
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
}
.sev-critical{ background: var(--bad); box-shadow: 0 0 6px var(--bad); }
.sev-high{ background: var(--warn); }
.sev-medium{ background: var(--accent); }
.pat-tags{
  display: flex; flex-wrap: wrap; gap: 4px;
  padding-left: 16px;
}
.chip{
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--bg-3);
  color: var(--fg-2);
  border: 0.5px solid var(--border);
}

/* ─── Mule network ─── */
.mule-wrap{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mule-graph{ width: 100%; height: 220px; }
.mule-row{
  display: grid;
  grid-template-columns: 60px 40px 60px 36px 40px;
  gap: 6px; align-items: center;
  padding: 3px 0;
  font-size: 11px;
  border-bottom: 0.5px solid var(--border);
}
.mule-row:last-child{ border-bottom: 0; }
.mule-hd{ font-size: 9px; color: var(--fg-2); font-weight: 600; letter-spacing: 0.08em; border-bottom: 0.5px solid var(--border-strong); }

/* ─── Model perf ─── */
.model-row{
  display: grid;
  grid-template-columns: 1.2fr 0.7fr 0.7fr 0.7fr 0.6fr 0.7fr;
  gap: 6px; align-items: center;
  padding: 5px 0;
  font-size: 11px;
  border-bottom: 0.5px solid var(--border);
}
.model-row:last-child{ border-bottom: 0; }
.model-hd{ font-size: 9px; color: var(--fg-2); font-weight: 600; letter-spacing: 0.08em; border-bottom: 0.5px solid var(--border-strong); }
.status{
  display: inline-block; padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600;
  border-radius: 2px;
  text-align: center;
}
.status-live{ background: var(--ok-soft); color: var(--ok); }
.status-shadow{ background: var(--accent-soft); color: var(--accent); }
.status-fallback{ background: var(--bg-3); color: var(--fg-2); }

function rid(n=6){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)];
  return s;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function genTxn(now=Date.now()){
  const cat = pick(CATEGORIES);

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}
function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">

      </div>
      {children}
    </div>
  );
}
function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}
function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (trackRef.current) { const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); } };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}
function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value} onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect, TweakColor,
});

  <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

function Spark({values, color, height=24, width=80, area=true}){
  const max = Math.max(...values), min = Math.min(...values);
  const range = max-min || 1;
  const pts = values.map((v,i)=>{
    const x = (i/(values.length-1))*width;
    const y = height - ((v-min)/range)*height;
    return [x,y];
  });
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const fill = area ? `${d} L${width} ${height} L0 ${height} Z` : null;
  return (
    <svg width={width} height={height} style={{display:'block',overflow:'visible'}}>
      {area && <path d={fill} fill={color} opacity="0.12"/>}
      <path d={d} fill="none" stroke={color} strokeWidth="1.25"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2" fill={color}/>
    </svg>
  );
}

function KpiCard({k, dense, sparkData}){
  const toneCol = k.tone==='good' ? 'var(--ok)' : k.tone==='bad' ? 'var(--bad)' : 'var(--fg-2)';
  const arrow = k.dir==='up' ? '▲' : k.dir==='down' ? '▼' : '·';
  return (
    <div className="kpi" style={{borderTopColor: k.tone==='bad' ? 'var(--bad)' : k.tone==='good' ? 'var(--ok)' : 'var(--accent)'}}>
      <div className="kpi-hd">
        <span className="lbl">{k.label}</span>
        <span className={`kpi-delta ${k.tone}`}>{arrow} {k.delta}</span>
      </div>
      <div className="kpi-val">{k.value}</div>
      <div className="kpi-foot">
        <span className="kpi-sub">{k.sub}</span>
        {sparkData && <Spark values={sparkData} color={toneCol} width={dense?56:72} height={18}/>}
      </div>
    </div>
  );
}

              <span className="mono">{t.bank}</span>

function MuleNetwork(){
  const nodes = MULE_NODES;
  const cx = 180, cy = 110, r = 80;
  return (
    <div className="card">
      <div className="card-hd"><span className="card-title">MULE NETWORK · DETECTED CHAINS</span><span className="badge bad">147 NODES</span></div>
      <div className="mule-wrap">
        <svg className="mule-graph" viewBox="0 0 360 220">
          {nodes.map((n,i)=>{
            const a = (i/nodes.length)*Math.PI*2 - Math.PI/2;
            const x = cx + Math.cos(a)*r;
            const y = cy + Math.sin(a)*r;
            return <line key={'l'+i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--fg-3)" strokeWidth="0.5" strokeDasharray="2 2"/>;
          })}
          {nodes.map((n,i)=>{
            const a = (i/nodes.length)*Math.PI*2 - Math.PI/2;
            const x = cx + Math.cos(a)*r;
            const y = cy + Math.sin(a)*r;
            const sz = 4+n.degree*0.7;
            return (
              <g key={n.id}>
                <circle cx={x} cy={y} r={sz} fill="var(--bad)" opacity="0.85"/>
                <circle cx={x} cy={y} r={sz+3} fill="none" stroke="var(--bad)" opacity="0.25"/>
                <text x={x} y={y+sz+10} textAnchor="middle" fontSize="9" fill="var(--fg-2)" fontFamily="ui-monospace">{n.id}</text>
              </g>
            );
          })}
          <circle cx={cx} cy={cy} r="14" fill="var(--accent)" opacity="0.95"/>
          <text x={cx} y={cy+3} textAnchor="middle" fontSize="9" fill="var(--bg)" fontWeight="700" fontFamily="ui-monospace">DEST</text>
        </svg>
        <div className="mule-tbl">
          <div className="mule-row mule-hd"><span>NODE</span><span>TXNS</span><span>IN/OUT</span><span>DEG</span><span>RISK</span></div>
          {nodes.map(n=>(
            <div key={n.id} className="mule-row">

              <span className="mono num dim">{n.inflow}</span>

            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TxnChatbot({txn}){
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState('');
  const [loading, setLoading]   = useState(false);
  const endRef = useRef(null);

  const ts = () => new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});

  useEffect(()=>{
    setMessages([{
      role:'ai',
      text:`Hi! I'm your **AI Investigator** powered by Claude.\nTransaction **${txn.id}** has a risk score of **${txn.risk}/100** (${txn.risk>=70?'🔴 HIGH':txn.risk>=40?'🟡 MEDIUM':'🟢 LOW'}).\n\nHow can I help you analyse it?`,
      time: ts(),
    }]);
    setInput('');
  },[txn.id]);

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[messages,loading]);

  const QUICK = [
    {label:'🔍 Why flagged?',     msg:`Why was transaction ${txn.id} flagged? Explain in detail.`},
    {label:'📊 Explain score',    msg:`Explain the risk score of ${txn.risk}/100 for ${txn.id}`},
    {label:'🚦 What action?',     msg:`What action should I take for ${txn.id}?`},
  ];

  // Simple inline markdown → HTML
  const md = t => t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code class="wa-code">$1</code>')
    .replace(/^• (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]+<\/li>)/g,m=>`<ul class="wa-ul">${m}</ul>`)
    .replace(/\n/g,'<br/>');

  // Local fallback when backend is offline
  const localReply = (q) => {
    const lo = q.toLowerCase();
    if(lo.includes('why')||lo.includes('flag')||lo.includes('explain')||lo.includes('score')){
      const rules=[];
      if(txn.newDevice) rules.push('🔴 **NEW_DEVICE** (+18) — Unrecognised device footprint');
      if(txn.velocity>10) rules.push(`🔴 **VELOCITY>10** (+21) — ${txn.velocity} txns/hr exceeds limit`);
      if(txn.newPayee&&txn.amount>20000) rules.push(`🟡 **NEW_PAYEE_HIGH_AMT** (+24) — ₹${txn.amount.toLocaleString('en-IN')} to first-time payee`);
      if(txn.amount%1000===0) rules.push('🟡 **AMOUNT_ROUND** (+8) — Structuring pattern detected');
      if(!rules.length) rules.push('🔵 **ML_ANOMALY** — Subtle deviation from behavioural baseline');
      return `**Risk Score: ${txn.risk}/100**\n\nTriggered rules for **${txn.id}**:\n${rules.map(r=>'• '+r).join('\n')}\n\n_Recommended: ${txn.risk>=70?'BLOCK or Step-up Auth':'Send to Review'}_`;
    }
    if(lo.includes('action')||lo.includes('recommend')||lo.includes('block')||lo.includes('clear')){
      if(txn.risk>=80) return `Score **${txn.risk}/100** → 🔴 **BLOCK**\n\nImmediately block and notify the account holder. High-confidence fraud signal with multiple red flags.`;
      if(txn.risk>=50) return `Score **${txn.risk}/100** → 🟡 **SEND TO REVIEW**\n\nEscalate to senior analyst. Additional authentication or manual check advised.`;
      return `Score **${txn.risk}/100** → 🟢 **CLEAR**\n\nTransaction appears legitimate. Risk is within acceptable threshold.`;
    }
    return `I can analyse **${txn.id}** in detail. Try:\n• _"Why was this flagged?"_\n• _"What action should I take?"_\n• _"Explain the risk score"_`;
  };

  const sendMsg = async (text) => {
    const msg = (text||input).trim();
    if(!msg||loading) return;
    setInput('');
    setMessages(prev=>[...prev,{role:'user',text:msg,time:ts()}]);
    setLoading(true);
    try{
      const res = await fetch('http://localhost:8000/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message:msg, transaction_id:txn.id}),
        signal: AbortSignal.timeout(25000),
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      setMessages(prev=>[...prev,{role:'ai',text:data.answer||(data.reply||'(No response)'),time:ts()}]);
    } catch(_){
      setMessages(prev=>[...prev,{role:'ai',text:localReply(msg),time:ts()}]);
    } finally { setLoading(false); }
  };

  /* ── inline styles (immune to CSS cascade) ── */
  const S = {
    wrap:  { display:'flex', flexDirection:'column', borderRadius:'8px', overflow:'hidden',
              background:'#0b141a', flexShrink:0 },
    hd:    { display:'flex', alignItems:'center', gap:'10px', padding:'10px 13px',
              background:'#202c33', flexShrink:0 },
    hdAv:  { width:36, height:36, borderRadius:'50%', flexShrink:0,
              background:'linear-gradient(135deg,#00a884,#128c7e)',
              display:'flex', alignItems:'center', justifyContent:'center', color:'#fff' },
    hdName:{ fontSize:13, fontWeight:600, color:'#e9edef', fontFamily:'Geist,sans-serif' },
    hdSub: { display:'flex', alignItems:'center', gap:5, fontSize:10, color:'#8696a0', marginTop:1 },
    dot:   { width:7, height:7, borderRadius:'50%', background:'#00a884', boxShadow:'0 0 4px #00a884', display:'inline-block' },
    msgs:  { height:260, overflowY:'auto', padding:'10px 12px',
              display:'flex', flexDirection:'column', gap:6, scrollBehavior:'smooth' },
    rowAi: { display:'flex', justifyContent:'flex-start', marginBottom:2 },
    rowUs: { display:'flex', justifyContent:'flex-end', marginBottom:2 },
    bubAi: { maxWidth:'85%', padding:'7px 10px 3px', borderRadius:'8px 8px 8px 2px',
              background:'#202c33', color:'#e9edef', fontSize:12, lineHeight:1.55,
              fontFamily:'Geist,sans-serif', wordBreak:'break-word', position:'relative' },
    bubUs: { maxWidth:'85%', padding:'7px 10px 3px', borderRadius:'8px 8px 2px 8px',
              background:'#005c4b', color:'#e9edef', fontSize:12, lineHeight:1.55,
              fontFamily:'Geist,sans-serif', wordBreak:'break-word', position:'relative' },
    foot:  { display:'flex', alignItems:'center', justifyContent:'flex-end', gap:4, marginTop:3 },
    ts:    { fontSize:10, color:'#8696a0' },
    ticks: { fontSize:11, color:'#53bdeb', letterSpacing:-1 },
    dots:  { display:'flex', gap:4, padding:'3px 2px' },
    chips: { display:'flex', flexWrap:'wrap', gap:5, padding:'7px 12px',
              borderTop:'1px solid rgba(255,255,255,.06)', flexShrink:0 },
    chip:  { background:'#1a2530', border:'1px solid rgba(0,168,132,.28)', color:'#00a884',
              borderRadius:16, padding:'4px 11px', fontSize:10, cursor:'pointer',
              fontFamily:'Geist,sans-serif', whiteSpace:'nowrap' },
    inRow: { display:'flex', alignItems:'center', gap:8, padding:'8px 12px',
              background:'#202c33', borderRadius:'0 0 8px 8px', flexShrink:0 },
    inBox: { flex:1, background:'#2a3942', border:'none', borderRadius:20,
              padding:'8px 14px', fontSize:12, color:'#e9edef',
              fontFamily:'Geist,sans-serif', outline:'none' },
    btn:   { width:36, height:36, borderRadius:'50%', background:'#00a884', border:'none',
              color:'#fff', cursor:'pointer', display:'flex', alignItems:'center',
              justifyContent:'center', flexShrink:0 },
    btnDis:{ width:36, height:36, borderRadius:'50%', background:'#3c4d52', border:'none',
              color:'#fff', cursor:'not-allowed', display:'flex', alignItems:'center',
              justifyContent:'center', flexShrink:0 },
  };

  const isDisabled = loading || !input.trim();

  return (
    <div style={S.wrap}>
      {/* Header */}
      <div style={S.hd}>
        <div style={S.hdAv}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5L12 0z"/>
          </svg>
        </div>
        <div style={{flex:1}}>
          <div style={S.hdName}>AI Investigator</div>
          <div style={S.hdSub}><span style={S.dot}/> Analysing {txn.id} · Score {txn.risk}/100</div>
        </div>
        {loading && <div style={{fontSize:10,color:'#00a884',fontStyle:'italic'}}>thinking…</div>}
      </div>

      {/* Messages — 260 px fixed, scrolls internally */}
      <div style={S.msgs}>
        {messages.map((m,i)=>(
          <div key={i} style={m.role==='ai' ? S.rowAi : S.rowUs}>
            <div style={m.role==='ai' ? S.bubAi : S.bubUs}>
              <div dangerouslySetInnerHTML={{__html: md(m.text)}}/>
              <div style={S.foot}>
                <span style={S.ts}>{m.time}</span>
                {m.role==='user' && <span style={S.ticks}>✓✓</span>}
              </div>
            </div>
          </div>
        ))}
        {loading && (
          <div style={S.rowAi}>
            <div style={S.bubAi}>
              <div style={S.dots}>
                {[0,200,400].map(d=>(
                  <span key={d} style={{width:7,height:7,borderRadius:'50%',background:'#8696a0',
                    display:'inline-block',animation:'wa-pop 1.2s infinite',animationDelay:d+'ms'}}/>
                ))}
              </div>
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>

      {/* Quick chips */}
      <div style={S.chips}>
        {QUICK.map((q,i)=>(
          <button key={i} style={S.chip} disabled={loading} onClick={()=>sendMsg(q.msg)}>{q.label}</button>
        ))}
      </div>

      {/* Input */}
      <div style={S.inRow}>
        <input
          style={S.inBox}
          placeholder="Ask about this transaction…"
          value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') sendMsg(); }}
          disabled={loading}
        />
        <button style={isDisabled ? S.btnDis : S.btn} disabled={isDisabled} onClick={()=>sendMsg()}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

function TxnDrawer({txn, onClose, onAction}){
  if(!txn) return null;
  const fmt = (n) => '₹'+n.toLocaleString('en-IN');
  const features = [
    {k:'Risk score', v:txn.risk, type:'score'},
    {k:'Amount', v:fmt(txn.amount)},
    {k:'Category', v:txn.category},
    {k:'Payer VPA', v:txn.payer, mono:true},
    {k:'Payee VPA', v:txn.payee, mono:true},
    {k:'Bank (from→to)', v:`${txn.bank} → ${txn.bankTo}`},
    {k:'App', v:txn.app},
    {k:'City', v:txn.city},
    {k:'Device', v:txn.device, mono:true},
    {k:'IP address', v:txn.ip, mono:true},
    {k:'Velocity (1h)', v:txn.velocity+' txns'},
    {k:'New device', v:txn.newDevice?'YES':'no', tone:txn.newDevice?'bad':null},
    {k:'New payee', v:txn.newPayee?'YES':'no', tone:txn.newPayee?'warn':null},
  ];
  const rules = [
    {name:'AMOUNT_ROUND',      hit: txn.amount%1000===0,                          weight:8},
    {name:'NEW_PAYEE_HIGH_AMT',hit: txn.newPayee && txn.amount>20000,             weight:24},
    {name:'NEW_DEVICE',        hit: txn.newDevice,                                weight:18},
    {name:'OFF_HOURS',         hit: txn.timestamp.getHours()<6||txn.timestamp.getHours()>23, weight:14},
    {name:'VELOCITY>10',       hit: txn.velocity>10,                              weight:21},
    {name:'P2P_HIGH_VAL',      hit: txn.category==='P2P' && txn.amount>30000,     weight:15},
  ];
  return (
    <div className="drawer-bg" onClick={onClose}>
      <div className="drawer" onClick={e=>e.stopPropagation()}>
        <div className="drawer-hd">
          <div>
            <div className="dr-id mono accent">{txn.id}</div>
            <div className="dr-time mono dim">{txn.timestamp.toString().slice(0,24)}</div>
          </div>
          <button className="x-btn" onClick={onClose}>✕</button>
        </div>
        <div className="drawer-banner">
          <RiskPill score={txn.risk}/>
          <span className="dr-amt mono">{fmt(txn.amount)}</span>
          <CatPill cat={txn.category}/>
          <FlagPill flag={txn.flag}/>
        </div>
        <div className="drawer-section">
          <div className="dr-hd">FEATURES</div>
          <div className="dr-features">
            {features.map(f=>(
              <div key={f.k} className="dr-feat">
                <span className="dr-k">{f.k}</span>
                <span className={`dr-v ${f.mono?'mono':''} ${f.tone?f.tone+'-fg':''}`}>{f.v}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="drawer-section">
          <div className="dr-hd">RULE EXPLANATION</div>
          <div className="dr-rules">
            {rules.map(r=>(
              <div key={r.name} className={'dr-rule '+(r.hit?'hit':'miss')}>
                <span className="mono">{r.hit?'●':'○'}</span>
                <span className="mono">{r.name}</span>
                <span className="mono num dim">+{r.weight}</span>
              </div>
            ))}
          </div>
        </div>
        <TxnChatbot txn={txn}/>
        <div className="drawer-actions">
          <button className="btn bad"   onClick={()=>onAction('block',txn)}>BLOCK</button>
          <button className="btn warn"  onClick={()=>onAction('review',txn)}>SEND TO REVIEW</button>
          <button className="btn ok"    onClick={()=>onAction('clear',txn)}>CLEAR</button>
          <button className="btn ghost" onClick={()=>onAction('escalate',txn)}>ESCALATE</button>
        </div>
      </div>
    </div>
  );
}

function StgRisk(){
  const [reviewVal, setReviewVal] = useState(40);
  const [blockVal,  setBlockVal]  = useState(70);
  const [velocity,  setVelocity]  = useState(3);
  const [pendingR,  setPendingR]  = useState(40);
  const [pendingB,  setPendingB]  = useState(70);
  const dirty = pendingR !== reviewVal || pendingB !== blockVal;
  return (
    <>
      <div className="stg-warning-banner">
        <span className="stg-warning-title">Caution.</span>
        {' '}Lowering BLOCK threshold catches more fraud but increases false positives. Changes apply on save.
      </div>
      <div className="stg-card">
        <div className="stg-card-hd">
          <span className="stg-card-label">SCORING TIERS</span>
          <span className="stg-card-badge">production v4.2</span>
        </div>
        <div className="stg-row">
          <div className="stg-row-info">
            <div className="stg-row-name">REVIEW threshold</div>
            <div className="stg-row-desc">Score ≥ this routes to analyst queue.</div>
            <div className="stg-accent-note">default · 40</div>
          </div>
          <input type="number" className="stg-num-input" value={pendingR} min={0} max={100}
                 onChange={e=>setPendingR(Number(e.target.value))}/>
        </div>
        <div className="stg-row">
          <div className="stg-row-info">
            <div className="stg-row-name">BLOCK threshold</div>
            <div className="stg-row-desc">Score ≥ this auto-blocks the transaction.</div>
            <div className="stg-accent-note">default · 70</div>
          </div>
          <input type="number" className="stg-num-input" value={pendingB} min={0} max={100}
                 onChange={e=>setPendingB(Number(e.target.value))}/>
        </div>
        {dirty && (
          <div className="stg-card-actions">
            <button className="stg-btn-outline" onClick={()=>{setPendingR(reviewVal);setPendingB(blockVal);}}>Cancel</button>
            <button className="stg-btn-primary" onClick={()=>{setReviewVal(pendingR);setBlockVal(pendingB);}}>Apply</button>
          </div>
        )}
      </div>
      <div className="stg-card">
        <div className="stg-card-hd"><span className="stg-card-label">BEHAVIORAL TRIGGERS</span></div>

function SettingsPage({t, setTweak}){
  const [activeTab,     setActiveTab]     = useState('USER');
  const [activeSection, setActiveSection] = useState('appearance');
  const [saved,         setSaved]         = useState(true);

  const idx = STG_SECTIONS.findIndex(s=>s.id===activeSection);
  const cur = STG_SECTIONS[idx];

  const wrappedSet = (k,v) => { setTweak(k,v); setSaved(false); };

  const handleSave  = () => setSaved(true);
  const handleReset = () => { setActiveSection('appearance'); setSaved(true); };

  const renderSection = () => {
    switch(activeSection){
      case 'appearance':   return <StgAppearance t={t} setTweak={wrappedSet}/>;
      case 'layout':       return <StgLayout t={t} setTweak={wrappedSet}/>;
      case 'modules':      return <StgModules t={t} setTweak={wrappedSet}/>;
      case 'datastream':   return <StgDataStream t={t} setTweak={wrappedSet}/>;
      case 'risk':         return <StgRisk/>;
      case 'alert':        return <StgAlertRouting/>;
      case 'integrations': return <StgIntegrations/>;
      case 'team':         return <StgTeamRoles/>;
      case 'audit':        return <StgAuditLog/>;
      default:             return null;
    }
  };

  return (
    <div className="stg-root">
      {/* page header */}
      <div className="stg-hd">
        <div className="stg-hd-left">
          <span className="stg-hd-title">Settings</span>
          <span className="stg-sep">/</span>
          <span className="stg-hd-crumb">system</span>
          <span className="stg-sep">/</span>
          <span className="stg-hd-crumb">settings</span>
        </div>
        <div className="stg-hd-actions">
          {!saved && <span className="stg-unsaved">unsaved</span>}
          <button className="stg-btn-reset" onClick={handleReset}>Reset</button>
          <button className="stg-btn-save" onClick={handleSave}>Save changes</button>
        </div>
      </div>
      {/* tabs */}
      <div className="stg-tabs">
        {['USER','ENV','INTEGRATIONS','LAST CHANGE'].map(tab=>(
          <div key={tab} className={'stg-tab'+(activeTab===tab?' active':'')}
               onClick={()=>setActiveTab(tab)}>{tab}</div>
        ))}
      </div>
      {/* body */}
      <div className="stg-body">
        <nav className="stg-nav">
          <div className="stg-nav-label">SECTIONS</div>
          {STG_SECTIONS.map(s=>(
            <div key={s.id} className={'stg-nav-item'+(activeSection===s.id?' active':'')}
                 onClick={()=>setActiveSection(s.id)}>
              <div className="stg-nav-name">{s.name}</div>
              <div className="stg-nav-sub">{s.sub}</div>
            </div>
          ))}
          <div className="stg-nav-foot">{STG_SECTIONS.length} sections · 32 fields</div>
        </nav>
        <div className="stg-main">
          <div className="stg-section-badge">SECTION · {idx+1} OF {STG_SECTIONS.length}</div>
          <div className="stg-section-title">{cur.name}</div>
          <div className="stg-section-sub">{cur.sub}</div>
          {renderSection()}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [t, setTweak]     = useTweaks(TWEAK_DEFAULTS);
  const [active, setActive] = useState('overview');
  const [feed, setFeed]   = useState(()=>genFeed(60));
  const [alerts, setAlerts] = useState(ALERTS_SEED);
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState({kind:'all', bank:null});
  const [paused, setPaused] = useState(false);
  const [time, setTime]   = useState(()=>new Date().toTimeString().slice(0,8)+' IST');

  useEffect(()=>{
    const i = setInterval(()=>setTime(new Date().toTimeString().slice(0,8)+' IST'), 1000);
    return ()=>clearInterval(i);
  },[]);

  useEffect(()=>{
    if(paused || t.animSpeed===0) return;
    const interval = 1000 / t.animSpeed;
    const i = setInterval(()=>{
      const tx = genTxn();
      setFeed(f => [tx, ...f].slice(0,80));
      if(tx.flag==='BLOCK' && Math.random()<0.5){
        setAlerts(a => [{
          level: tx.risk>=85?'CRIT':'WARN',
          msg: `${tx.category} ${('₹'+tx.amount.toLocaleString('en-IN'))} · risk ${tx.risk} · ${tx.city}`,
          time: tx.timestamp.toTimeString().slice(0,8),
          txn: tx.id,
        }, ...a].slice(0,12));
      }
    }, interval);
    return ()=>clearInterval(i);
  },[t.animSpeed, paused]);

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme', t.theme);
    document.documentElement.style.setProperty('--accent', t.accent);
    document.documentElement.style.setProperty('--accent-soft', t.accent+'24');
  },[t.theme, t.accent]);

  const onAction = (act, txn) => {
    setAlerts(a => [{
      level: act==='block'?'CRIT':act==='review'?'WARN':'INFO',
      msg: `Analyst action: ${act.toUpperCase()} on ${txn.id}`,
      time: new Date().toTimeString().slice(0,8),
      txn: txn.id,
    }, ...a].slice(0,12));
    setSelected(null);
  };

  const Page = (()=>{
    switch(active){
      case 'overview': return <OverviewPage tweaks={t} feed={feed} alerts={alerts} onSelectTxn={setSelected} filter={filter} setFilter={setFilter} paused={paused} setPaused={setPaused}/>;
      case 'feed':     return (<><div className="page-hd"><h1>Live Transaction Feed</h1><span className="crumbs">/ ops / feed</span></div><LiveFeed feed={feed} filter={filter} setFilter={setFilter} onSelect={setSelected} animSpeed={t.animSpeed} dense={false} paused={paused} setPaused={setPaused}/><div className="row r3"><RiskDistribution/><VelocityCard/><AttackPatterns/></div></>);
      case 'risk':     return (<><div className="page-hd"><h1>Risk Models</h1><span className="crumbs">/ intel / models</span></div><ModelPerf/><div className="row r2"><RiskDistribution/><AttackPatterns/></div></>);
      case 'mule':     return (<><div className="page-hd"><h1>Mule Network</h1><span className="crumbs">/ intel / mule</span></div><MuleNetwork/><div className="row r2"><AttackPatterns/><GeoAnomaly/></div></>);
      case 'geo':      return (<><div className="page-hd"><h1>Geographic Anomalies</h1><span className="crumbs">/ intel / geo</span></div><div className="row r2"><GeoAnomaly/><MuleNetwork/></div></>);
      case 'banks':    return (<><div className="page-hd"><h1>Bank Analytics</h1><span className="crumbs">/ intel / banks</span></div><BankBreakdown/><div className="row r2"><CategoryMix/><RiskDistribution/></div></>);
      case 'alerts':   return (<><div className="page-hd"><h1>Alert Stream</h1><span className="crumbs">/ ops / alerts</span></div><AlertFeed alerts={alerts}/><div className="row r2"><AttackPatterns/><VelocityCard/></div></>);
      case 'patterns': return (<><div className="page-hd"><h1>Attack Patterns</h1><span className="crumbs">/ intel / patterns</span></div><AttackPatterns/><div className="row r2"><MuleNetwork/><GeoAnomaly/></div></>);
      case 'analyst':  return (<><div className="page-hd"><h1>Analyst Performance</h1><span className="crumbs">/ system / analysts</span></div><AlertFeed alerts={alerts}/></>);
      default:         return <SettingsPage t={t} setTweak={setTweak}/>;
    }
  })();

  return (
    <div className={'app layout-'+t.layout+(t.density==='compact'?' dense':'')}>
      <Topbar time={time}/>
      <Sidebar active={active} setActive={setActive}/>
      <main className="main">{Page}</main>
      {selected && <TxnDrawer txn={selected} onClose={()=>setSelected(null)} onAction={onAction}/>}
      <AppTweaks t={t} setTweak={setTweak}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

/* ── SQL block ───────────────────────────────────────────── */
.sql-blk{
  margin-top:9px;background:rgba(0,0,0,.35);
  border-radius:8px;padding:8px 11px;border-left:3px solid #4cc4d7;
}
.sql-lbl{font-size:9px;color:#4cc4d7;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.sql-code{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:#b6bdc9;white-space:pre-wrap;word-break:break-all;display:block;
}

/* ── Results table ───────────────────────────────────────── */
.res-blk{margin-top:9px;}
.res-lbl{font-size:9px;color:#f0b049;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.res-scroll{overflow-x:auto;border-radius:6px;max-height:140px;overflow-y:auto;}
.res-tbl{width:100%;border-collapse:collapse;font-size:10px;
  font-family:'JetBrains Mono',monospace;}
.res-tbl th{
  background:rgba(76,196,215,.15);color:#4cc4d7;
  padding:4px 8px;text-align:left;font-weight:600;
  white-space:nowrap;position:sticky;top:0;
}
.res-tbl td{
  padding:3px 8px;border-top:1px solid rgba(255,255,255,.05);
  color:#b6bdc9;white-space:nowrap;
}
.res-tbl tr:hover td{background:rgba(255,255,255,.03);}

/* ── Intent badge ────────────────────────────────────────── */
.i-badge{
  display:inline-block;margin-top:8px;padding:2px 8px;
  border-radius:4px;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;
}
.i-explain_risk{background:rgba(236,91,91,.2);color:#ec5b5b;}
.i-nl_to_sql   {background:rgba(76,196,215,.2);color:#4cc4d7;}
.i-insights    {background:rgba(240,176,73,.2);color:#f0b049;}
.i-general     {background:rgba(138,125,240,.2);color:#8a7df0;}

/* ── Typing indicator ────────────────────────────────────── */
.typing{display:flex;gap:4px;padding:4px 2px;}
.typing span{
  width:6px;height:6px;border-radius:50%;background:#7c8492;
  animation:ty-bounce 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes ty-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* ── Suggestions ─────────────────────────────────────────── */
.chat-sugg{
  padding:8px 12px;display:flex;flex-wrap:wrap;gap:5px;
  border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;
}
.sugg-chip{
  background:#1d222b;border:1px solid rgba(76,196,215,.22);
  color:#b6bdc9;border-radius:20px;padding:4px 10px;
  font-size:10px;cursor:pointer;transition:all .15s;
  white-space:nowrap;font-family:'Geist',sans-serif;
}
.sugg-chip:hover:not(:disabled){
  background:rgba(76,196,215,.14);color:#4cc4d7;border-color:#4cc4d7;
}
.sugg-chip:disabled{opacity:.45;cursor:not-allowed;}

/* ── Input row ───────────────────────────────────────────── */
.chat-in-row{
  padding:10px 12px;display:flex;gap:8px;align-items:flex-end;
  border-top:1px solid rgba(255,255,255,.07);
  background:#161a21;flex-shrink:0;
}
.chat-in{
  flex:1;background:#1d222b;
  border:1px solid rgba(255,255,255,.1);color:#e7eaf0;
  border-radius:10px;padding:8px 12px;font-size:12px;
  font-family:'Geist',sans-serif;resize:none;outline:none;
  transition:border-color .15s;max-height:100px;
}
.chat-in:focus{border-color:rgba(76,196,215,.5);}
.chat-in::placeholder{color:#4a525e;}
.send-btn{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#4cc4d7 0%,#8a7df0 100%);
  border:none;color:#fff;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .15s,transform .15s;
}
.send-btn:disabled{opacity:.38;cursor:not-allowed;}
.send-btn:not(:disabled):hover{transform:scale(1.1);}

/* ── Connection badge ────────────────────────────────────── */
.conn-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;margin-right:5px;vertical-align:middle;
}
.conn-ok{background:#6ec96a;box-shadow:0 0 6px #6ec96a;}
.conn-err{background:#ec5b5b;box-shadow:0 0 6px #ec5b5b;}
.conn-chk{background:#f0b049;animation:conn-pulse 1s infinite;}
@keyframes conn-pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>

<div id="chatbot-root"></div>

<script type="text/babel">
/* ── UPI Risk Copilot Widget ─────────────────────────────── */
(function(){
const { useState, useRef, useEffect, useCallback } = React;
const API = 'http://localhost:8000';

const SUGGESTIONS = [
  { label: '🔍 Why was this flagged?',     msg: 'Why was this transaction flagged? Explain the risk score and triggered rules in detail.' },
  { label: '🏙️ Fraud from Delhi today',   msg: 'Show me all fraud transactions from Delhi today' },
  { label: '📈 Fraud trend this week',     msg: "What's my fraud trend this week? Generate insights and patterns." },
  { label: '🏦 Top mule accounts',         msg: 'Which cities have the highest average risk scores? Give me a breakdown.' },
];

// Simple markdown renderer (bold, italic, code, headers, bullets, line breaks)
function renderMd(text) {
  if (!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/^# (.+)$/gm,'<h3>$1</h3>')
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, (m) => `<ul>${m}</ul>`)
    .replace(/\n/g,'<br/>');
}

function SqlBlock({ sql }) {
  return (
    <div className="sql-blk">
      <div className="sql-lbl">Generated SQL</div>
      <code className="sql-code">{sql}</code>
    </div>
  );
}

function ResultsTable({ rows, total }) {
  if (!rows || rows.length === 0) return null;
  const keys = Object.keys(rows[0]).slice(0, 6);
  const displayRows = rows.slice(0, 10);
  return (
    <div className="res-blk">
      <div className="res-lbl">
        {total} result{total !== 1 ? 's' : ''}{rows.length < total ? ` (showing ${rows.length})` : ''}
      </div>
      <div className="res-scroll">
        <table className="res-tbl">
          <thead>
            <tr>{keys.map(k => <th key={k}>{k}</th>)}</tr>
          </thead>
          <tbody>
            {displayRows.map((row, ri) => (
              <tr key={ri}>
                {keys.map((k, ki) => {
                  const v = row[k];
                  const disp = typeof v === 'number'
                    ? (Number.isInteger(v) ? v.toLocaleString('en-IN') : v.toFixed(2))
                    : String(v ?? '—');
                  return <td key={ki}>{disp}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Message({ m }) {
  const isBot = m.role === 'bot';
  return (
    <div className={`c-msg ${isBot ? 'c-msg-bot' : 'c-msg-user'}`}>
      {isBot && <span className="c-av">🤖</span>}
      <div className={`c-bub ${isBot ? 'c-bub-bot' : 'c-bub-user'}`}>
        <div dangerouslySetInnerHTML={{ __html: renderMd(m.text) }} />
        {m.sql     && <SqlBlock sql={m.sql} />}
        {m.rows    && <ResultsTable rows={m.rows} total={m.totalCount} />}
        {isBot && m.intentType && m.intentType !== 'general' && (
          <span className={`i-badge i-${m.intentType}`}>
            {m.intentType === 'explain_risk' ? '🔍 Risk Explanation'
              : m.intentType === 'nl_to_sql' ? '🗄️ SQL Query'
              : m.intentType === 'insights'   ? '📊 Insights'
              : m.intentType}
          </span>
        )}
      </div>
      {!isBot && <span className="c-av">👤</span>}
    </div>
  );
}

function ChatbotWidget() {
  const [open, setOpen]       = useState(false);
  const [conn, setConn]       = useState('checking'); // 'ok' | 'err' | 'checking'
  const [txnId, setTxnId]     = useState('');
  const [input, setInput]     = useState('');
  const [loading, setLoading] = useState(false);
  const [msgs, setMsgs]       = useState([{
    role: 'bot',
    text: "Hello! I'm your **UPI Risk Copilot**, powered by Claude AI.\n\nAsk me to:\n- **Explain** why a transaction was flagged\n- **Query** transactions with natural language\n- **Generate** fraud trend insights\n- **Lookup** RBI regulations & fraud policies",
    intentType: null,
  }]);
  const endRef = useRef(null);

  // Health-check connection
  useEffect(() => {
    fetch(`${API}/health`, { signal: AbortSignal.timeout(4000) })
      .then(r => r.ok ? setConn('ok') : setConn('err'))
      .catch(() => setConn('err'));
  }, [open]);

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [msgs, loading]);

  const send = useCallback(async (text) => {
    const msg = (text || input).trim();
    if (!msg || loading) return;
    setInput('');
    setMsgs(prev => [...prev, { role: 'user', text: msg }]);
    setLoading(true);
    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, transaction_id: txnId || null }),
        signal: AbortSignal.timeout(30000),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      setMsgs(prev => [...prev, {
        role: 'bot',
        text: data.answer || '(No response)',
        intentType: data.type,
        sql: data.sql || null,
        rows: data.rows || null,
        totalCount: data.total_count || 0,
      }]);
    } catch (e) {
      setMsgs(prev => [...prev, {
        role: 'bot',
        text: `⚠️ **Backend unreachable.**\n\nStart the server:\n\`\`\`\nuvicorn chatbot_backend:app --reload --port 8000\n\`\`\`\n\nMake sure \`ANTHROPIC_API_KEY\` is set in your environment.`,
        intentType: 'error',
      }]);
    } finally {
      setLoading(false);
    }
  }, [loading, input, txnId]);

  const onKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };

  return (
    <>
      <button className="chat-fab" onClick={() => setOpen(o => !o)} title="UPI Risk Copilot">
        {open ? '✕' : '🤖'}
      </button>

      {open && (
        <div className="chat-panel">
          {/* Header */}
          <div className="chat-hd">
            <div className="chat-hd-left">
              <span className="chat-hd-avatar">🤖</span>
              <div>
                <div className="chat-hd-title">UPI Risk Copilot</div>
                <div className="chat-hd-sub">
                  <span className={`conn-dot ${conn === 'ok' ? 'conn-ok' : conn === 'err' ? 'conn-err' : 'conn-chk'}`}/>
                  {conn === 'ok' ? 'Llama 3.1 · Live' : conn === 'err' ? 'Backend offline' : 'Connecting…'}
                  &nbsp;·&nbsp;RAG + NL-to-SQL
                </div>
              </div>
            </div>
            <input
              className="txn-id-input"
              placeholder="TXN ID…"
              value={txnId}
              onChange={e => setTxnId(e.target.value)}
              title="Optional: enter a Transaction ID for risk explanation context"
            />
          </div>

          {/* Messages */}
          <div className="chat-msgs">
            {msgs.map((m, i) => <Message key={i} m={m} />)}
            {loading && (
              <div className="c-msg c-msg-bot">
                <span className="c-av">🤖</span>
                <div className="c-bub c-bub-bot">
                  <div className="typing"><span/><span/><span/></div>
                </div>
              </div>
            )}
            <div ref={endRef} />
          </div>

          {/* Suggested prompts */}
          <div className="chat-sugg">
            {SUGGESTIONS.map((s, i) => (
              <button key={i} className="sugg-chip" disabled={loading} onClick={() => send(s.msg)}>
                {s.label}
              </button>
            ))}
          </div>

          {/* Input */}
          <div className="chat-in-row">
            <textarea
              className="chat-in"
              rows={1}
              placeholder="Ask about fraud, risk scores, trends…"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={onKey}
            />
            <button className="send-btn" disabled={loading || !input.trim()} onClick={() => send()}>↑</button>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('chatbot-root')).render(<ChatbotWidget/>);
})();
</script>
</body>
</html>
